name: Build unsigned IPA

on:
  # Auto-publish (Grace, 2026-11-19): pushing a version tag (e.g.
  # v0.1.7) builds that version and publishes its Nightly pre-release,
  # replacing older Nightlies. Ordinary branch pushes never trigger
  # this workflow. A manual dispatch only builds - it never publishes.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

# 防止同一条预发行流水线同时运行，避免版本号冲突和重复替换。
concurrency:
  group: launchshield-prerelease
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest Xcode 26
        run: |
          ls /Applications | grep -i Xcode || true
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE_APP" ]; then XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"; fi
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Resolve version from the tag
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NEXT_VERSION="${GITHUB_REF_NAME#v}"
          else
            git fetch --tags --force >/dev/null 2>&1 || true
            LATEST="$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || echo v0.0.0)"
            NEXT_VERSION="${LATEST#v}"
          fi
          if [[ ! "$NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $NEXT_VERSION (tags must look like v1.2.3)"
            exit 1
          fi
          NEXT_BUILD="$RUN_NUMBER"
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$NEXT_BUILD" >> "$GITHUB_OUTPUT"
          echo "IPA_NAME=LaunchShield-$NEXT_VERSION-unsigned.ipa" >> "$GITHUB_ENV"
          echo "Next version: $NEXT_VERSION (build $NEXT_BUILD)"

      - name: Build app (unsigned)
        env:
          NEXT_VERSION: ${{ steps.version.outputs.version }}
          NEXT_BUILD: ${{ steps.version.outputs.build }}
        run: |
          xcodebuild build \
            -project LaunchShield.xcodeproj \
            -scheme LaunchShield \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA (Info-ZIP)
        env:
          NEXT_VERSION: ${{ steps.version.outputs.version }}
          NEXT_BUILD: ${{ steps.version.outputs.build }}
        run: |
          APP_PATH="$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          echo "App: $APP_PATH"
          test -n "$APP_PATH"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $NEXT_VERSION" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT_BUILD" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r -X "$IPA_NAME" Payload
          unzip -l "$IPA_NAME" | head -20
          ls -la "$IPA_NAME"

      - name: Publish Nightly (replace previous prereleases)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$NEXT_VERSION"

          # If this version already has a release: a formal release is
          # never touched; a pre-release is deleted (tag kept) and
          # recreated below.
          if TARGET_RELEASE_TYPE="$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease' 2>/dev/null)"; then
            if [ "$TARGET_RELEASE_TYPE" != "true" ]; then
              echo "::error::Tag $TAG belongs to a formal release; refusing to replace it."
              exit 1
            fi
            echo "Deleting existing Nightly release $TAG (tag kept)"
            gh release delete "$TAG" --yes
          fi

          cat > /tmp/notes.md <<NOTES
          Nightly

          Rolling test build from the prerelease branch, published
          automatically from version tag $TAG.
          - Build number is assigned automatically by the workflow.
          - Older Nightly releases are removed; only the newest stays.
          - Formal releases are never deleted.
          NOTES

          # Remove every other old Nightly release and its tag, so only
          # this one remains.
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease == true) | .tagName' |
          while IFS= read -r OLD_TAG; do
            [ -n "$OLD_TAG" ] || continue
            echo "Deleting previous prerelease: $OLD_TAG"
            gh release delete "$OLD_TAG" --yes --cleanup-tag
          done

          gh release create "$TAG" "$IPA_NAME" \
            --prerelease \
            --title "Nightly" \
            --notes-file /tmp/notes.md
