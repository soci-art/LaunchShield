name: Build and publish official IPA

on:
  workflow_dispatch:

permissions:
  contents: write

# Keep official releases serialized: never overlap two release builds.
concurrency:
  group: launchshield-main-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest Xcode 26
        run: |
          ls /Applications | grep -i Xcode || true
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE_APP" ]; then XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"; fi
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Build app (unsigned)
        run: |
          xcodebuild build \
            -project LaunchShield.xcodeproj \
            -scheme LaunchShield \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Set rolling version and package IPA
        id: version
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          echo "App: $APP_PATH"
          test -n "$APP_PATH"

          # Use the highest existing stable semantic-version tag, then bump patch.
          git fetch --tags --force
          HIGHEST="0.0.0"
          while IFS= read -r TAG; do
            VERSION="${TAG#v}"
            if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              if [ "$(printf '%s\n%s\n' "$HIGHEST" "$VERSION" | sort -V | tail -1)" = "$VERSION" ]; then
                HIGHEST="$VERSION"
              fi
            fi
          done < <(git tag --list 'v[0-9]*')

          IFS='.' read -r MAJOR MINOR PATCH <<< "$HIGHEST"
          NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          TAG="v$NEXT_VERSION"

          # Keep the app's bundle version aligned with the new release.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $NEXT_VERSION" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$APP_PATH/Info.plist"

          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          IPA_NAME="LaunchShield-$NEXT_VERSION-unsigned.ipa"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist"

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r -X "$IPA_NAME" Payload
          unzip -l "$IPA_NAME" | head -20
          ls -la "$IPA_NAME"

      - name: Publish official release (keep all previous releases and IPAs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          cat > /tmp/notes.md << NOTES
          LaunchShield $VERSION 正式版

          本次发布由 main 分支手动构建。
          IPA：${{ env.IPA_NAME }}

          此次发布采用滚动版本号。每次成功构建都会创建新的正式版 Release，
          不删除、不覆盖任何历史 Release、tag 或 IPA 附件。
          NOTES

          gh release create "$TAG" "${{ env.IPA_NAME }}" \
            --title "LaunchShield $VERSION" \
            --notes-file /tmp/notes.md
