name: Build and publish official IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "本次正式版 App 版本号（例如 3.3.5）"
        required: true
        type: string
      build_number:
        description: "本次正式版内部构建号（正整数，例如 105）"
        required: true
        type: string
      delete_previous_releases:
        description: "发布前删除旧正式版 Release 及其 Tag（默认关闭）"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

# Keep official releases serialized: never overlap two release builds.
concurrency:
  group: launchshield-main-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest Xcode 26
        run: |
          ls /Applications | grep -i Xcode || true
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE_APP" ]; then XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"; fi
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Build app (unsigned)
        run: |
          xcodebuild build \
            -project LaunchShield.xcodeproj \
            -scheme LaunchShield \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Set manual version and package IPA
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          echo "App: $APP_PATH"
          test -n "$APP_PATH"

          NEXT_VERSION="$VERSION_INPUT"
          if [[ ! "$NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号格式无效，请使用 x.y.z，例如 3.3.5"
            exit 1
          fi
          NEXT_BUILD="$BUILD_NUMBER_INPUT"
          if [[ ! "$NEXT_BUILD" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::构建号格式无效，请填写正整数，例如 105"
            exit 1
          fi
          TAG="v$NEXT_VERSION"

          # Never overwrite an existing tag or release.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::版本 $NEXT_VERSION 对应的 Tag 已存在，请填写新的版本号。"
            exit 1
          fi

          # Keep the app's bundle version aligned with the new release.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $NEXT_VERSION" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT_BUILD" "$APP_PATH/Info.plist"

          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$NEXT_BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          IPA_NAME="LaunchShield-$NEXT_VERSION-unsigned.ipa"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist"

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r -X "$IPA_NAME" Payload
          unzip -l "$IPA_NAME" | head -20
          ls -la "$IPA_NAME"

      - name: Publish official release (keep all previous releases and IPAs)
        env:
          GH_TOKEN: ${{ github.token }}
          DELETE_PREVIOUS: ${{ inputs.delete_previous_releases }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          cat > /tmp/notes.md << NOTES
          LaunchShield $VERSION 正式版

          本次发布由 main 分支手动构建。
          IPA：${{ env.IPA_NAME }}

          App 版本号和内部构建号均由本次工作流运行时手动指定。
          不删除、不覆盖任何历史 Release、tag 或 IPA 附件。
          NOTES

          # Only remove previous official releases when explicitly selected.
          if [ "$DELETE_PREVIOUS" = "true" ]; then
            gh release list --limit 100 --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease == false) | .tagName' |
            while IFS= read -r OLD_TAG; do
              [ -n "$OLD_TAG" ] || continue
              echo "Deleting previous official release: $OLD_TAG"
              gh release delete "$OLD_TAG" --yes --cleanup-tag
            done
          else
            echo "Keeping all previous official releases."
          fi

          gh release create "$TAG" "${{ env.IPA_NAME }}" \
            --title "LaunchShield $VERSION" \
            --notes-file /tmp/notes.md
