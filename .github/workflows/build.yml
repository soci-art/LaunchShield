name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "本次 Nightly App 版本号（例如 3.3.5）"
        required: true
        type: string
      build_number:
        description: "内部构建号：新版本用 1；只有替换同一个版本时才往上加（2、3…）"
        required: true
        type: string
        default: "1"
      replace_previous_prerelease:
        description: "发布前删除旧 Nightly 及其 Tag（默认开启）"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

# 防止同一条预发行流水线同时运行，避免版本号冲突和重复替换。
concurrency:
  group: launchshield-prerelease
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode 27
        run: |
          ls /Applications | grep -i Xcode || true
          XCODE_APP="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE_APP" ]; then XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"; fi
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Validate manual version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          NEXT_VERSION="$VERSION_INPUT"
          if [[ ! "$NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号格式无效，请使用 x.y.z，例如 3.3.5"
            exit 1
          fi
          NEXT_BUILD="$BUILD_NUMBER_INPUT"
          if [[ ! "$NEXT_BUILD" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::构建号格式无效，请填写正整数，例如 105"
            exit 1
          fi
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$NEXT_BUILD" >> "$GITHUB_OUTPUT"
          echo "IPA_NAME=LaunchShield-$NEXT_VERSION-unsigned.ipa" >> "$GITHUB_ENV"
          echo "Next version: $NEXT_VERSION (build $NEXT_BUILD)"

      - name: Build app (unsigned)
        env:
          NEXT_VERSION: ${{ steps.version.outputs.version }}
          NEXT_BUILD: ${{ steps.version.outputs.build }}
        run: |
          xcodebuild build \
            -project LaunchShield.xcodeproj \
            -scheme LaunchShield \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA (Info-ZIP)
        env:
          NEXT_VERSION: ${{ steps.version.outputs.version }}
          NEXT_BUILD: ${{ steps.version.outputs.build }}
        run: |
          APP_PATH="$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          echo "App: $APP_PATH"
          test -n "$APP_PATH"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $NEXT_VERSION" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT_BUILD" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r -X "$IPA_NAME" Payload
          unzip -l "$IPA_NAME" | head -20
          ls -la "$IPA_NAME"

      - name: Publish Nightly (optionally replace previous prereleases)
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.version.outputs.version }}
          NEXT_BUILD: ${{ steps.version.outputs.build }}
          REPLACE_PREVIOUS: ${{ inputs.replace_previous_prerelease }}
        run: |
          set -euo pipefail
          TAG="v$NEXT_VERSION"

          # 防止误删同名正式版：只有目标版本不存在 Release 或属于 prerelease 时才允许替换。
          if TARGET_RELEASE_TYPE="$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease' 2>/dev/null)"; then
            if [ "$TARGET_RELEASE_TYPE" != "true" ]; then
              echo "::error::Tag $TAG 对应的是正式版 Release，已停止替换以保护正式版。"
              exit 1
            fi
          fi

          cat > /tmp/notes.md <<NOTES
          Nightly
          构建号：$NEXT_BUILD

          本次为 prerelease 分支的 Nightly 滚动测试构建。
          - 版本号由本次工作流运行时手动指定。
          - App 版本号和内部构建号均由本次工作流运行时手动指定。
          - 是否删除旧 Nightly 由本次运行的选项决定。
          - 正式版不会被删除。

          安装与兼容：
          - 本 IPA 未签名，需要使用适合自身设备的签名方式签名后安装。
          - 具体可用通道取决于 iOS 版本、签名方式及签名中包含的 App Group 权限；请以应用内检测结果为准。
          NOTES

          # 仅当本次明确选择替换时，才删除旧 Nightly；正式版始终保留。
          if [ "$REPLACE_PREVIOUS" = "true" ]; then
            # 先删除所有旧 Nightly Release 和对应 Tag，再创建本次版本。
            gh release list --limit 100 --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease == true) | .tagName' |
            while IFS= read -r OLD_TAG; do
              [ -n "$OLD_TAG" ] || continue
              echo "Deleting previous prerelease: $OLD_TAG"
              gh release delete "$OLD_TAG" --yes --cleanup-tag
            done

            # 目标 Tag 可能只残留在 Git 仓库中、却没有对应 Release；也必须清理。
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Deleting leftover target tag: $TAG"
              git push origin ":refs/tags/$TAG"
            fi
          else
            # 不替换时绝不删除旧 Release/Tag；目标 Tag 冲突则明确停止。
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::版本 $NEXT_VERSION 对应的 Tag 已存在；如需复用该版本，请勾选“发布前删除旧 Nightly 及其 Tag”。"
              exit 1
            fi
            echo "Keeping all previous prereleases."
          fi

          # 删除完成后再检查一次，避免残留 Tag 导致 gh release create 失败。
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::目标 Tag $TAG 清理后仍然存在，已停止发布以避免覆盖错误版本。"
            exit 1
          fi

          gh release create "$TAG" "$IPA_NAME" \
            --prerelease \
            --title "Nightly" \
            --notes-file /tmp/notes.md
