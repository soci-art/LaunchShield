name: Build and publish official IPA

on:
  # Auto-publish (Grace, 2026-11-19): pushing a version tag (e.g.
  # v0.1.7) builds that version and publishes its formal release.
  # Ordinary branch pushes never trigger this workflow. A manual
  # dispatch only builds - it never publishes.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

# Keep official releases serialized: never overlap two release builds.
concurrency:
  group: launchshield-main-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest Xcode 26
        run: |
          ls /Applications | grep -i Xcode || true
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE_APP" ]; then XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"; fi
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Resolve version from the tag
        id: meta
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            git fetch --tags --force >/dev/null 2>&1 || true
            LATEST="$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || echo v0.0.0)"
            VERSION="${LATEST#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $VERSION (tags must look like v1.2.3)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (build $RUN_NUMBER), tag v$VERSION"

      - name: Build app (unsigned)
        run: |
          xcodebuild build \
            -project LaunchShield.xcodeproj \
            -scheme LaunchShield \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Set version and package IPA
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER_INPUT: ${{ steps.meta.outputs.build }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          echo "App: $APP_PATH"
          test -n "$APP_PATH"

          NEXT_VERSION="$VERSION_INPUT"
          if [[ ! "$NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号格式无效，请使用 x.y.z，例如 3.3.5"
            exit 1
          fi
          NEXT_BUILD="$BUILD_NUMBER_INPUT"
          if [[ ! "$NEXT_BUILD" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::构建号格式无效，请填写正整数，例如 105"
            exit 1
          fi
          TAG="v$NEXT_VERSION"

          # The version tag is the trigger: it already exists by design.

          # Keep the app's bundle version aligned with the new release.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $NEXT_VERSION" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT_BUILD" "$APP_PATH/Info.plist"

          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$NEXT_BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          IPA_NAME="LaunchShield-$NEXT_VERSION-unsigned.ipa"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist"

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r -X "$IPA_NAME" Payload
          unzip -l "$IPA_NAME" | head -20
          ls -la "$IPA_NAME"

      - name: Publish official release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build }}"

          # Protect a same-named pre-release: never touch a Nightly.
          if EXISTING_TYPE="$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease' 2>/dev/null)"; then
            if [ "$EXISTING_TYPE" != "false" ]; then
              echo "::error::$TAG is a pre-release, not a formal release; refusing to touch it."
              exit 1
            fi
            echo "Release $TAG already exists - replacing its IPA in place, keeping its notes."
            gh release upload "$TAG" "${{ env.IPA_NAME }}" --clobber
            exit 0
          fi

          cat > /tmp/notes.md << NOTES
          LaunchShield $VERSION formal release

          Published automatically from version tag $TAG (main branch).
          IPA: ${{ env.IPA_NAME }}
          Build: $BUILD (numbered automatically by the workflow)

          No historical Release, tag or IPA is deleted or overwritten.
          NOTES

          gh release create "$TAG" "${{ env.IPA_NAME }}" \
            --title "LaunchShield $VERSION" \
            --notes-file /tmp/notes.md
