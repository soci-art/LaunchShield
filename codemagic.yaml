# Codemagic 云端构建 LaunchShield（备用通道，GitHub Actions 不可用时启用）。
# 在 Codemagic 的 Mac mini M2 上编译出未签名 IPA，不需要苹果账号或签名材料。
workflows:
  ios-unsigned:
    name: LaunchShield unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Build unsigned
        script: |
          xcodebuild -project LaunchShield.xcodeproj \
            -scheme LaunchShield \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package unsigned IPA
        script: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/LaunchShield.app" Payload/
          zip -r -X LaunchShield-0.1.0-unsigned.ipa Payload
    artifacts:
      - LaunchShield-0.1.0-unsigned.ipa
